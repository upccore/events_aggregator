[project]
name = "events-aggregator"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn>=0.47.0",
    "sqlalchemy>=2.0.49",
    "psycopg2-binary>=2.9.12",
    "httpx>=0.28.0",
    "pydantic>=2.13.4",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.4.0",
    "sentry-sdk[fastapi]>=2.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
asyncio_mode = "auto"